
name: QuickKart Microservices CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        service:
          - inventory-service
          - product-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Verify Maven Project
        working-directory: ./${{ matrix.service }}
        run: |
          pwd
          ls -la
          ls -l pom.xml

      - name: Build Microservice
        working-directory: ./${{ matrix.service }}
        run: mvn clean package
