services:

  mysql:
    image: mysql:8.4
    container_name: quickkart-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventorydb
      MYSQL_USER: rushi
      MYSQL_PASSWORD: rushi@1499
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  inventory-service:
    build: .
    container_name: inventory-service
    ports:
      - "8082:8082"
    environment:
      DB_USERNAME: rushi
      DB_PASSWORD: rushi@1499
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data: